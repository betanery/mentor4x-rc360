name: Apply dependency security fixes

on:
  push:
    branches:
      - tech/dependency-security-20260906

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-breaking audit fixes
        run: npm audit fix
      - name: Validate after dependency fixes
        run: |
          npm test
          npm run build
          npx tsc --noEmit -p tsconfig.app.json
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit dependency updates
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency files changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply non-breaking dependency fixes"
          git push
