name: Fix admin university state

on:
  push:
    branches:
      - ux/flow-simplification-20260906
    paths:
      - .github/workflows/fix-admin-university-state.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/flow-simplification-20260906
      - name: Apply state fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/pages/AdminUniversity.tsx')
          text = p.read_text()
          text = text.replace(
              '  const [loading, setLoading] = useState(true);\n',
              '  const [loading, setLoading] = useState(true);\n  const [loadError, setLoadError] = useState<string | null>(null);\n'
          )
          old = '''  const load = async () => {\n    setLoading(true);\n    const [{ data: c }, { data: l }] = await Promise.all([\n      supabase.from("courses").select("*").order("order_index", { ascending: true }),\n      supabase.from("lessons").select("*").order("order_index", { ascending: true }),\n    ]);\n    setCourses((c as Course[]) || []);\n    setLessons((l as Lesson[]) || []);\n    setLoading(false);\n  };'''
          new = '''  const load = async () => {\n    setLoading(true);\n    setLoadError(null);\n    const [coursesRes, lessonsRes] = await Promise.all([\n      supabase.from("courses").select("*").order("order_index", { ascending: true }),\n      supabase.from("lessons").select("*").order("order_index", { ascending: true }),\n    ]);\n    setLoading(false);\n    const error = coursesRes.error || lessonsRes.error;\n    if (error) {\n      const message = error.message || "Não foi possível carregar a Universidade 4X.";\n      setLoadError(message);\n      toast.error(message);\n      return;\n    }\n    setCourses((coursesRes.data as Course[]) || []);\n    setLessons((lessonsRes.data as Lesson[]) || []);\n  };'''
          if old not in text:
              raise SystemExit('load block not found')
          text = text.replace(old, new)
          old_render = '''      {loading ? (\n        <Card className="p-12 flex items-center justify-center"><Loader2 className="h-6 w-6 animate-spin" /></Card>\n      ) : courses.length === 0 ? ('''
          new_render = '''      {loadError ? (\n        <Card className="p-8 text-center">\n          <p className="font-semibold">Não foi possível carregar a Universidade 4X.</p>\n          <p className="mt-1 text-sm text-muted-foreground">{loadError}</p>\n          <Button className="mt-4" variant="outline" onClick={() => void load()}>Tentar novamente</Button>\n        </Card>\n      ) : loading ? (\n        <Card className="p-12 flex items-center justify-center text-muted-foreground"><Loader2 className="h-6 w-6 animate-spin mr-2" /> Carregando Universidade 4X...</Card>\n      ) : courses.length === 0 ? ('''
          if old_render not in text:
              raise SystemExit('render block not found')
          text = text.replace(old_render, new_render)
          p.write_text(text)
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/fix-admin-university-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminUniversity.tsx .github/workflows/fix-admin-university-state.yml
          git commit -m "UX: add recoverable University admin error state"
          git push origin HEAD:ux/flow-simplification-20260906
