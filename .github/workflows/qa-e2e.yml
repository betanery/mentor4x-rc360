name: QA E2E Validation

on:
  push:
    branches:
      - qa/end-to-end-validation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Type safety
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Install isolated browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end by user profile
        run: npm run test:e2e

      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mentor4x-e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 14
