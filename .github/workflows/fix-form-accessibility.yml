name: Fix form accessibility labels

on:
  push:
    branches:
      - ux/flow-simplification-20260906
    paths:
      - .github/workflows/fix-form-accessibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/flow-simplification-20260906
      - name: Apply accessibility fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          goals = Path('src/pages/Goals.tsx')
          text = goals.read_text()
          text = text.replace(
              '<div><Label>Impacto financeiro (R$)</Label><Input type="number" value={form.financial_impact}',
              '<div><Label>Impacto financeiro (R$)</Label><Input aria-label="Impacto financeiro (R$)" type="number" value={form.financial_impact}'
          )
          text = text.replace(
              '<div><Label>Semana de início</Label><Input type="date" value={form.week_start}',
              '<div><Label>Semana de início</Label><Input aria-label="Semana de início" type="date" value={form.week_start}'
          )
          goals.write_text(text)

          bottlenecks = Path('src/pages/Bottlenecks.tsx')
          text = bottlenecks.read_text()
          text = text.replace(
              '<div><Label>Posição no Top 5</Label><Input type="number" min={1} max={5} value={form.rank_position}',
              '<div><Label>Posição no Top 5</Label><Input aria-label="Posição no Top 5" type="number" min={1} max={5} value={form.rank_position}'
          )
          text = text.replace(
              '<div><Label>Prazo</Label><Input type="date" value={form.due_date}',
              '<div><Label>Prazo</Label><Input aria-label="Prazo do gargalo" type="date" value={form.due_date}'
          )
          bottlenecks.write_text(text)
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/fix-form-accessibility.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Goals.tsx src/pages/Bottlenecks.tsx .github/workflows/fix-form-accessibility.yml
          git commit -m "a11y: label advanced form fields"
          git push origin HEAD:ux/flow-simplification-20260906
