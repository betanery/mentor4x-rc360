name: Deploy Edge Hardening Once

on:
  push:
    branches:
      - main
    paths:
      - .deploy/edge-hardening-20260905.trigger3

permissions:
  contents: read

concurrency:
  group: supabase-edge-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wtlvircittxcjiczqlne

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Missing required GitHub secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF" >/dev/null

      - name: Deploy authorized security-hardened functions
        shell: bash
        run: |
          set -euo pipefail
          functions=(admin-invite admin-list-users ai-action chat socio-tools)
          for function_name in "${functions[@]}"; do
            echo "Deploying ${function_name}..."
            supabase functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Verify remote function inventory
        shell: bash
        run: |
          set -euo pipefail
          supabase functions list --project-ref "$SUPABASE_PROJECT_REF"
